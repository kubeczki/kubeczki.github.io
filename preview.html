<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podgląd strony</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #171717; color: #f4f4f4; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    input { position: absolute; opacity: 0; pointer-events: none; }
    .toolbar {
      position: sticky;
      z-index: 1;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      min-height: 3.5rem;
      padding: .65rem;
      border-bottom: 1px solid #3b3b3b;
      background: #202020;
    }
    label {
      padding: .55rem .9rem;
      border: 1px solid #555;
      border-radius: 999px;
      cursor: pointer;
      font-size: .85rem;
      font-weight: 700;
    }
    #phone:checked ~ .toolbar label[for="phone"],
    #desktop:checked ~ .toolbar label[for="desktop"] { border-color: #f1c84b; background: #f1c84b; color: #171717; }
    .stage {
      display: grid;
      min-height: calc(100vh - 3.5rem);
      padding: 1.25rem;
      place-items: start center;
      overflow: auto;
    }
    iframe {
      display: block;
      width: 450px;
      height: min(844px, calc(100vh - 6rem));
      border: 8px solid #090909;
      border-radius: 24px;
      background: white;
      box-shadow: 0 1rem 3rem #0008;
      transition: width .2s ease, height .2s ease, border-radius .2s ease;
    }
    #desktop:checked ~ .stage iframe {
      width: min(1440px, calc(100vw - 2.5rem));
      height: calc(100vh - 6rem);
      border-width: 1px;
      border-radius: 2px;
    }
    @media (max-width: 490px) {
      .stage { padding-inline: 0; }
      iframe { width: 100%; border-inline: 0; border-radius: 0; }
    }
    @media (prefers-reduced-motion: reduce) { iframe { transition: none; } }
  </style>
</head>
<body>
  <input type="radio" name="viewport" id="phone" checked>
  <input type="radio" name="viewport" id="desktop">
  <nav class="toolbar" aria-label="Rozmiar podglądu">
    <label for="phone">Telefon · 450 px</label>
    <label for="desktop">Desktop</label>
  </nav>
  <main class="stage">
    <iframe src="index.html" title="Podgląd zaproszenia"></iframe>
  </main>
</body>
</html>
